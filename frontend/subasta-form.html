<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Publicar Subasta - SubastaYa</title>

    <link rel="stylesheet" href="/src/styles/style.css">
    <link rel="stylesheet" href="/src/styles/radio-button.css">
    <link rel="stylesheet" href="/src/styles/header.css">
    <link rel="stylesheet" href="/src/styles/subasta-form.css">
    <link rel="stylesheet" href="/src/styles/spinner.css">
    <link rel="stylesheet" href="/src/styles/toast.css">
  </head>
  <body>
    <header id="header" class="header">
    </header>
    <main>
        <div class="pagina-titulo">
            <h1>Publicar nueva subasta</h1>
        </div>

        <div class="form-container">
            <form id="subasta-form">
                <div class="form-column producto-card">
                    <div class="form-section">
                        <div class="form-header">
                            <ion-icon name="bag-outline"></ion-icon>
                            <h2>Detalles del producto</h2>
                        </div>
                        <hr>
                        <div class="form-body">
                            <div class="form-field">
                                <label for="titulo" class="form-label">Título</label>
                                <input type="text" id="titulo" name="titulo" class="form-input" required>
                                <p class="field-error" id="tituloError" class="hidden"></p>
                            </div>
                            <div class="form-field descripcion-form-field">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea type="text" id="descripcion" name="descripcion" class="form-input" required></textarea>
                                <p class="field-error" id="descripcionError" class="hidden"></p>
                            </div>
                            <div class="form-field-group">
                                <div class="form-field">
                                    <label for="categoriaId" class="form-label">Categoría</label>
                                    <select name="categoriaId" id="categoriaId" class="form-select">
                                        <ion-icon name="caret-down-outline"></ion-icon>
                                    </select>
                                    <p class="field-error" id="categoriaIdError" class="hidden"></p>
                                </div>
                                <div class="form-field">
                                    <label for="urlImagen" class="form-label">URL de imagen</label>
                                    <input type="text" id="urlImagen" name="urlImagen" class="form-input" required>
                                    <p class="field-error" id="urlImagenError" class="hidden"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-column">
                    <div class="form-section">
                        <div class="form-header">
                            <ion-icon name="pricetag-outline"></ion-icon>
                            <h2>Precio</h2>
                        </div>
                        <hr>
                        <div class="form-body">
                            <div class="form-field">
                                <label for="precioBase" class="form-label">Precio base</label>
                                <input type="number" id="precioBase" name="precioBase" class="form-input" required min="1">
                                <p class="field-error" id="precioBaseError" class="hidden"></p>
                            </div>
                            <div class="form-field">
                                <label for="incrementoMinimo" class="form-label">Incremento mínimo</label>
                                <input type="number" id="incrementoMinimo" name="incrementoMinimo" class="form-input" required min="1">
                                <p class="field-error" id="incrementoMinimoError" class="hidden"></p>
                            </div>
                        </div>
                    </div>
                    <div class="form-section">
                        <div class="form-header">
                            <ion-icon name="calendar-outline"></ion-icon>
                            <h2>Programación</h2>
                        </div>
                        <hr>
                        <div class="form-body">
                            <div class="form-field">
                                <label for="comenzarInmediato" class="form-label form-checkbox-label">
                                    <input type="checkbox" id="comenzarInmediato" name="comenzarInmediato" class="form-checkbox">
                                    Comenzar de inmediato
                                </label>
                            </div>
                            <div class="form-field">
                                <label for="fechaInicio" class="form-label">Fecha y hora de inicio</label>
                                <input type="datetime-local" id="fechaInicio" name="fechaInicio" class="form-input" required>
                                <p class="field-error" id="fechaInicioError" class="hidden"></p>
                            </div>
                            <div class="form-field">
                                <label for="fechaFin" class="form-label">Fecha y hora de cierre</label>
                                <input type="datetime-local" id="fechaFin" name="fechaFin" class="form-input" required>
                                <p class="field-error" id="fechaFinError" class="hidden"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            <div class="buttons-container">
                <button type="button" form="subasta-form" class="primary-text-button" id="cancel-button">Cancelar</button>
                <button type="submit" form="subasta-form" class="primary-text-button" id="submit-button">Publicar subasta</button>
            </div>
        </div>
    </main>
    <script type="module" src="/src/controllers/subastaFormController.ts"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
  </body>

</html>
