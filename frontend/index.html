<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>SubastaYa - Catálogo</title>

    <link rel="stylesheet" href="/src/styles/style.css">
    <link rel="stylesheet" href="/src/styles/subasta-card.css">
    <link rel="stylesheet" href="/src/styles/header.css">
    <link rel="stylesheet" href="/src/styles/index.css">
  </head>
  <body>
    <header id="header" class="header">
    </header>
    <main>
        <section class="filtros-container">
            <h2>Filtros</h3>
            <h3 class="filtro-titulo">Categorías</h3>
            <div class="categorias-container">
                
            </div>
            <h3 class="filtro-titulo">Estado</h3>
            <div class="estados-container">
                <span class="estado-checkbox"><input type="checkbox"><p>Activa</p></span>
                <span class="estado-checkbox"><input type="checkbox"><p>Finalizada</p></span>
                <span class="estado-checkbox"><input type="checkbox"><p>Programada</p></span>
            </div>
            <h3 class="filtro-titulo">Rango de precio</h3>
            <div class="rango-precio-container">
                <input type="number" id="precio-min-input" placeholder="Mínimo">
                <span> - </span>
                <input type="number" id="precio-max-input" placeholder="Máximo">
            </div>
        </section>
        <section class='catalogo-container'>
            <div class="catalogo-header">
                <h1>Subastas</h1>
            </div>
            <div class="catalogo-cards-container">
                
            </div>
        </section>
    </main>
    <script type="module" src="/src/pages/catalogo.ts"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
  </body>

<template id="subasta-card-template">
    <div class="card-container" data-id="1">
        <div class="card-img-container">
            <img src="" alt="" id="img">
        </div>
        <div class="card-info">
            <div class="card-info-header">
                <p class="categoria">Categoria</p>
                <p class="puja-contador"></p>
            </div>
            <div class="card-info-body">
                <p class="titulo">Título</p>
            </div>
            <hr>
            <div class="card-info-footer">
                <div>
                    <p>Puja actual</p>
                    <span class="puja-actual-monto">$ 0</span>
                </div>
                <div class="card-tiempo-container">
                    <p class="tiempo-label"></p>
                    <span class="tiempo"></span>
                </div>
            </div>
        </div>
    </div>
</template>

<template id="categoria-template">
    <div class="categoria-container" data-id="">
        <ion-icon name="cube-outline"></ion-icon>
        <p class="categoria-nombre"></p>
    </div>
</template>

 </html>
