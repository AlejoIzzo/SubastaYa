<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Catálogo - SubastaYa</title>

    <link rel="stylesheet" href="/src/styles/style.css">
    <link rel="stylesheet" href="/src/styles/subasta-card.css">
    <link rel="stylesheet" href="/src/styles/radio-button.css">
    <link rel="stylesheet" href="/src/styles/header.css">
    <link rel="stylesheet" href="/src/styles/index.css">
    <link rel="stylesheet" href="/src/styles/spinner.css">
    <link rel="stylesheet" href="/src/styles/toast.css">
  </head>
  <body>
    <header id="header" class="header">
    </header>
    <main>
        <form class="filtros-container" id="filtros-form">
            <div class="filtros-header">
                <h2>Filtros</h3>
                <button type="reset" class="icon-button" title="Restablecer filtros" id="reset-filtros-button">
                    <ion-icon name="refresh-outline"></ion-icon>
                </button>
            </div>
            <h3 class="filtro-titulo">Categorías</h3>
            <div class="categorias-container">
                <label class="radio-button-label">
                    <span class="radio-circle"></span>
                    <input type="radio" name="categoriaId" class="radio-input" value="all" checked>
                    <ion-icon class="radio-button-icon" name="cube-outline"></ion-icon>
                    <span class="radio-button-text">Todas</span>
                </label>
            </div>
            <h3 class="filtro-titulo">Estado</h3>
            <div class="estados-container">
                <label class="radio-button-label">
                    <span class="radio-circle"></span>
                    <input type="radio" name="estado" class="radio-input" value="all" checked>
                    <span class="radio-button-text">Todos</span>
                </label>
            </div>
            <h3 class="filtro-titulo">Rango de precio</h3>
            <div class="rango-precio-container">
                <input type="number" id="precio-min-input" name="precioMin" placeholder="Mínimo">
                <span> - </span>
                <input type="number" id="precio-max-input" name="precioMax" placeholder="Máximo">
            </div>
            <h3 class="filtro-titulo">Ordenamiento</h3>
            <div class="ordeado-container">
                <select name="orden" id="orden" class="form-select">
                    <option value="tiempo_asc">Menor tiempo</option>
                    <option value="tiempo_desc">Mayor tiempo</option>
                    <option value="puja_desc">Mayor puja líder</option>
                    <option value="puja_asc">Menor puja líder</option>
                    <option value="recientes">Recientes</option>
                </select>
            </div>
            <button class="text-button" type="submit"><p>Aplicar Filtros</p></button>
        </form>
        <section class='catalogo-container'>
            <div class="catalogo-header">
                <h1>Subastas</h1>
                <a href="/subasta-form.html" class="text-button text-link publicar-subasta-button">
                    <ion-icon name="add-outline"></ion-icon>
                    <p>Publicar subasta</p>
                </a>
            </div>
            <div class="catalogo-cards-container">
            </div>
            <nav
                id="paginacion"
                class="paginacion"
                aria-label="Paginación del catálogo"
            >
            </nav>
        </section>
    </main>
    <script type="module" src="/src/pages/catalogo.ts"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
  </body>

</html>
