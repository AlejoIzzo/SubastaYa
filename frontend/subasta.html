<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>SubastaYa - Subasta</title>

    <link rel="stylesheet" href="/src/styles/style.css">
    <link rel="stylesheet" href="/src/styles/header.css">
    <link rel="stylesheet" href="/src/styles/subasta.css">
  </head>
  <body>
    <header id="header" class="header">
    </header>
    <main>
        <section class="producto-section">
            <div class="title-container">
                <h2 id="titulo"></h2>
                <p>Subastado por: <span id="vendedor-nombre"></span></p>
            </div>
            <div class="img-container">
                <img src="" alt="" id="subasta-img">
            </div>
            <div class="info-container">
                <h3>Descripción</h3>
                <p id="descripcion">
                    
                </p>
            </div>
        </section>
        <section class="puja-section">
            <div class="timer-container">
                <p id="timer-label"></p>
                <p id="timer">00:00:00</p>
                <p id="estado-label" class="hidden"></p>
            </div>
            <hr>
            <div id="subasta-resultado-container" class="hidden">
                <p id="subasta-resultado-label"></p>
                <p id="puja-ganadora-monto"></p>
            </div>
            <div id="puja-lider-container">
                <p id="puja-lider-label"></p>
                <p id="puja-lider-monto"></p>
                <div id="usuario-puja-estado" class="puja-estado lider">
                    <ion-icon name="alert-circle-outline" id="puja-estado-icon"></ion-icon>
                    <p id="puja-estado-texto"></p>
                </div>
            </div>
            <hr>
            <div id="puja-list">
                
            </div>
            <form id="puja-form">
                <hr>
                <span id="form-tooltip-text"></span>
                <div class="form-header">
                    <p>Incremento mínimo: $ <span id="incremento-minimo"></span></p>
                    <p>Tu saldo: $ <span id="usuario-saldo"></span></p>
                </div>
                <div class="form-body">
                    <input type="number" id="puja-input" name="monto" required>
                    <button type="submit" class="primary-text-button puja-button">Pujar</button>
                </div>
                <div class="form-error-container hidden">
                    <p class="form-error-message"></p>
                </div>
            </form>
        </section>
    </main>
    <script type="module" src="/src/pages/subasta.ts"></script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
  </body>

</html>
